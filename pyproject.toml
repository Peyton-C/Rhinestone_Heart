[project]
name = "rhinestone"
version = "0.1.0"
description = "A Mixxx MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-rtmidi>=1.5"]

[project.scripts]
rhinestone = "rhinestone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rhinestone"]

[dependency-groups]
dev = ["pytest>=8.0"]
